name: MemeForge Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check browser source
        run: |
          node --check src/app.js
          node --check src/engines/storage-engine.js

      - name: Run engine and wiring tests
        run: npm test
